<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CPLab — track your Codeforces progress, get personalised problem suggestions, and build practice sets that adapt to your rating." />
    <meta name="theme-color" content="#080810" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fcfcfd" media="(prefers-color-scheme: light)" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="CPLab — Competitive Programming Training" />
    <meta property="og:description" content="Sync with Codeforces, get problem suggestions matched to your rating, and track practice set progress." />
    <meta name="twitter:card" content="summary" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <title>CPLab — Competitive Programming Training</title>

    <!-- Apply the theme before first paint so there is no flash of the
         wrong colour scheme. Mirrors the logic in src/hooks/useTheme.js. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('cplab-theme')
          var theme =
            stored === 'cplab-night' || stored === 'cplab-light'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'cplab-light'
                : 'cplab-night'
          document.documentElement.setAttribute('data-theme', theme)
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'cplab-night')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
